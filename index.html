<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

      <aside class="sidebar">
      <div class="brand">
        <img src="images/view-dashboard.svg" alt="Dashboard Icon" class="icon icon-large" />
        <span>Dashboard</span>
      </div>

      <nav class="nav-links">
        <ul>
          <li>
            <img src="images/home.svg" alt="Home" class="icon" />
            <a href="#">Home</a>
          </li>
          <li>
            <img src="images/profile.svg" alt="Profile" class="icon" />
            <a href="#">Profile</a>
          </li>
          <li>
            <img src="images/messages.svg" alt="Messages" class="icon" />
            <a href="#">Messages</a>
          </li>
          <li>
            <img src="images/history.svg" alt="History" class="icon" />
            <a href="#">History</a>
          </li>
          <li>
            <img src="images/tasks.svg" alt="Tasks" class="icon" />
            <a href="#">Tasks</a>
          </li>
          <li>
            <img src="images/community.svg" alt="Communities" class="icon" />
            <a href="#">Communities</a>
          </li>
        </ul>

        <ul>
          <li>
            <img src="images/settings.svg" alt="Settings" class="icon" />
            <a href="#">Settings</a>
          </li>
          <li>
            <img src="images/help.svg" alt="Support" class="icon" />
            <a href="#">Support</a>
          </li>
          <li>
            <img src="images/privacy.svg" alt="Privacy" class="icon" />
            <a href="#">Privacy</a>
          </li>
        </ul>
      </nav>
    </aside>

</div>
</body>
</html>
