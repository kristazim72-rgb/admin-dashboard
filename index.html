<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

      <aside class="sidebar">
      <div class="brand">
        <img src="images/view-dashboard.svg" alt="Dashboard Icon" class="icon icon-large" />
        <span>Dashboard</span>
      </div>

      <nav class="nav-links">
        <ul>
          <li>
            <img src="images/home.svg" alt="Home" class="icon" />
            <a href="#">Home</a>
          </li>
          <li>
            <img src="images/profile.svg" alt="Profile" class="icon" />
            <a href="#">Profile</a>
          </li>
          <li>
            <img src="images/messages.svg" alt="Messages" class="icon" />
            <a href="#">Messages</a>
          </li>
          <li>
            <img src="images/history.svg" alt="History" class="icon" />
            <a href="#">History</a>
          </li>
          <li>
            <img src="images/tasks.svg" alt="Tasks" class="icon" />
            <a href="#">Tasks</a>
          </li>
          <li>
            <img src="images/community.svg" alt="Communities" class="icon" />
            <a href="#">Communities</a>
          </li>
        </ul>

        <ul>
          <li>
            <img src="images/settings.svg" alt="Settings" class="icon" />
            <a href="#">Settings</a>
          </li>
          <li>
            <img src="images/help.svg" alt="Support" class="icon" />
            <a href="#">Support</a>
          </li>
          <li>
            <img src="images/privacy.svg" alt="Privacy" class="icon" />
            <a href="#">Privacy</a>
          </li>
        </ul>
      </nav>
    </aside>

      <header class="header">
            <div class="header-top">
        <div class="search-bar">
          <img src="images/search.svg" alt="Search" class="icon icon-dark" />
          <input type="text" id="search" placeholder="Search..." />
        </div>
        <div class="user-notifications">
          <img src="images/notification.svg" alt="Notifications" class="icon icon-dark" />
          <img src="https://api.dicebear.com/10.x/clay/svg" alt="avatar" class="avatar-small" />
          <span class="user-name-small">Morgan Oakley</span>
        </div>
      </div>

      <div class="header-bottom">
        <div class="user-greeting">
        <img src="https://api.dicebear.com/10.x/clay/svg" alt="avatar" class="avatar-large" />
          <div>
            <p class="greeting-text">Hi there,</p>
            <h2 class="user-handle">Morgan Oakley (@morgan)</h2>
          </div>
        </div>
        <div class="header-buttons">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
      </header>

</body>
</html>
